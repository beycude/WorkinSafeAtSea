name: WSS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Surum numarasini oku
        run: |
          V=$(grep 'def appVersionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "Surum: $V, derleme: ${{ github.run_number }}"

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/wss.jks
            echo "Keystore bulundu, release imzasi kullanilacak."
          else
            echo "UYARI: KEYSTORE_BASE64 yok, debug imzasi kullanilacak."
          fi

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Imza anahtarini sil
        if: always()
        run: rm -f app/wss.jks

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: WorkinSafeAtSea-v${{ env.APP_VERSION }}-APK-b${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
